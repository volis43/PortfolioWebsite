        :root {
            --cyan: #00ffcc;
            --pink: #ff00aa;
            --purple: #8b5cf6;
            --bg-deep: #03050f;
            --glass-bg: rgba(10, 15, 30, 0.55);
            --glass-border: rgba(0, 255, 204, 0.18);
        }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-deep);
            color: #e0e0e0;
            cursor: default;
            overflow-x: hidden;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #03050f; border-radius: 10px; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(180deg, #00ffcc40, #ff00aa40, #00ffcc40);
            border-radius: 10px; border: 1px solid #ffffff10;
            backdrop-filter: blur(4px);
        }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(180deg, #00ffcc80, #ff00aa80, #00ffcc80); }

        /* Анимированная кибер-сетка */
        .cyber-grid {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
            perspective: 900px; overflow: hidden;
        }
        .cyber-grid::before {
            content: ''; position: absolute; inset: -50%;
            background-image: linear-gradient(rgba(0,255,204,0.06) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0,255,204,0.06) 1px, transparent 1px);
            background-size: 55px 55px;
            animation: gridShift 20s linear infinite;
            transform: rotateX(60deg) scale(2.2);
            transform-origin: center top;
            mask-image: radial-gradient(ellipse 70% 60% at 50% 35%, black 20%, transparent 70%);
        }
        .cyber-grid::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(ellipse at 50% 30%, #00ffcc08 0%, transparent 55%),
                        radial-gradient(ellipse at 80% 70%, #ff00aa06 0%, transparent 55%),
                        radial-gradient(ellipse at 20% 60%, #8b5cf608 0%, transparent 50%);
            animation: pulseGlow 8s ease-in-out infinite;
        }
        @keyframes gridShift {
            0% { transform: rotateX(60deg) scale(2.2) translateY(0); }
            100% { transform: rotateX(60deg) scale(2.2) translateY(55px); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Плавающие частицы */
        .particles-container { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
        .particle {
            position: absolute; border-radius: 50%;
            animation: floatUp linear infinite;
            opacity: 0; filter: blur(1px);
        }
        @keyframes floatUp {
            0% { transform: translateY(105vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        .content-layer { position: relative; z-index: 1; }

        /* Неоновые эффекты */
        .neon-cyan {
            text-shadow: 0 0 8px #00ffcc66, 0 0 25px #00ffcc44, 0 0 55px #00ffcc22;
            color: #00ffcc;
            animation: neonPulse 3s ease-in-out infinite;
        }
        .neon-pink {
            text-shadow: 0 0 8px #ff00aa66, 0 0 25px #ff00aa44, 0 0 55px #ff00aa22;
            color: #ff00aa;
            animation: neonPulse 3s ease-in-out 1s infinite;
        }
        @keyframes neonPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }
        .neon-white { text-shadow: 0 0 8px #ffffff33, 0 0 20px #ffffff18; }

        /* Стеклянные панели */
        .glass-future {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.04);
            transition: all 0.5s cubic-bezier(0.22, 0.61, 0.36, 1);
        }
        .glass-future:hover {
            border-color: rgba(0,255,204,0.4);
            box-shadow: 0 12px 50px rgba(0,255,200,0.15), 0 8px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
        }

        /* Глитч-эффект */
        .glitch-hover { position: relative; display: inline-block; }
        .glitch-hover::before, .glitch-hover::after {
            content: attr(data-text); position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s;
        }
        .glitch-hover::before { color: #00ffcc; z-index: -1; animation: glitchShift 0.4s infinite reverse; }
        .glitch-hover::after { color: #ff00aa; z-index: -2; animation: glitchShift 0.5s infinite; }
        .glitch-hover:hover::before, .glitch-hover:hover::after { opacity: 0.7; }
        @keyframes glitchShift {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-3px, 2px); }
            40% { transform: translate(3px, -1px); }
            60% { transform: translate(-1px, -2px); }
            80% { transform: translate(2px, 1px); }
        }

        /* Карточки проектов */
        .project-card {
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            position: relative; overflow: hidden;
        }
        .project-card:hover {
            transform: translateY(-20px) scale(1.04);
            box-shadow: 0 0 60px rgba(0,255,200,0.35);
            border-color: rgba(0,255,204,0.6);
        }
        .project-card .card-img-wrapper { overflow: hidden; position: relative; }
        .project-card .card-img-wrapper img {
            transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1);
        }
        .project-card:hover .card-img-wrapper img { transform: scale(1.12); }

        /* Анимированная рамка */
        @keyframes borderGlow {
            0%, 100% { border-color: rgba(0,255,204,0.3); }
            50% { border-color: rgba(255,0,170,0.5); }
        }
        .card-glow-anim { animation: borderGlow 3s ease-in-out infinite; }

        /* Появление при скролле */
        .reveal {
            opacity: 0; transform: translateY(50px);
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .reveal-delay-1 { transition-delay: 0.1s; }
        .reveal-delay-2 { transition-delay: 0.25s; }
        .reveal-delay-3 { transition-delay: 0.4s; }

        /* Модальное окно */
        .modal-img {
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: zoom-in;
        }
        .modal-img:hover { transform: scale(1.03); }

        /* Кнопка с переливающимся градиентом */
        .btn-future { position: relative; overflow: hidden; z-index: 1; transition: all 0.4s; }
        .btn-future::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, #00ffcc33, #ff00aa33, #8b5cf633);
            background-size: 300% 300%;
            animation: gradientShift 5s ease infinite;
            z-index: -1; border-radius: inherit;
        }
        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .btn-future:hover { transform: translateY(-3px); box-shadow: 0 10px 35px rgba(0,255,200,0.35); }

        /* Навигационные ссылки */
        .nav-link {

        }
        .nav-link::after {
            content: ''; position: absolute; bottom: 0; left: 50%;

            transform: translateX(-50%);
            box-shadow: 0 0 12px #00ffcc;
        }
        .nav-link:hover::after { width: 80%; }

        /* Эффект печатной машинки */

                        { title: "Fabric Ashesh", images: ["f1.png","f2.png","f3.png","f4.png"], desc: `<p class="text-gray-200">1〜4人用協力ホラー。協力パズルと緊迫した雰囲気。</p><p class="mt-4 text-cyan-400 font-semibold">2026年9月リリース予定。仮タイトル。</p>` },
                        { title: "Damn Fire", images: ["p1.png","sp2.png","sp3.png","sp4.png"], desc: `<p class="text-gray-200">ダークファンタジー世界のSouls-like。マルチプレイ対応。</p><p class="mt-4 text-amber-400 font-semibold">チームメンバー募集中 (3Dアーティスト、アニメーター等)。</p>` },
                        { title: "Faction Glitch", images: ["fg1.png","fg2.png","fg3.png","fg4.png"], desc: `<p class="text-gray-200">深いストーリーと独自のビジュアルスタイルのシングルプレイホラー。</p>` },
                        { title: "Matritz", images: ["m1.png","m2.png","m3.png","m4.png"], desc: `<p class="text-gray-200">大学3年の単位取得のための学術プロジェクト。UE5の経験を積む。</p>` }
                    ]
                }
            };

            let currentLang = 'ru';

            // ============ INTERSECTION OBSERVER ============
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('visible');
                        observer.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.18, rootMargin: '0px 0px -40px 0px' });

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

            // ============ ПРИМЕНЕНИЕ ЯЗЫКА ============
            function applyLanguage(lang) {
                currentLang = lang;
                document.documentElement.lang = lang;
                document.querySelectorAll('[data-i18n]').forEach(el => {
                    const key = el.getAttribute('data-i18n');
                    if (translations[lang] && translations[lang][key]) {
                        el.innerHTML = translations[lang][key];
                    }
                });
                const aboutContent = document.getElementById('about-content');
                if (aboutContent) {
                    const t = translations[lang];
                    aboutContent.innerHTML = `
                        <p class="text-gray-200">${t['about.experience']}</p>
                        <p class="text-pink-300 font-semibold text-xl">${t['about.job']}</p>
                        <p class="text-gray-200">${t['about.pet']}</p>
                        <ul class="space-y-3 text-gray-300">
                            <li class="flex items-start gap-3"><span class="text-cyan-400 mt-1"><i class="fas fa-ghost"></i></span><span>${t['about.horror']}</span></li>
                            <li class="flex items-start gap-3"><span class="text-amber-400 mt-1"><i class="fas fa-skull"></i></span><span>${t['about.souls']}</span></li>
                        </ul>
                    `;
                }
                document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
                const activeBtn = document.getElementById(`lang-${lang}`);
                if (activeBtn) activeBtn.classList.add('active');
                renderProjectCards();
                localStorage.setItem('preferredLang', lang);
            }

            // ============ КАРТОЧКИ ПРОЕКТОВ ============
            function renderProjectCards() {
                const grid = document.getElementById('projects-grid');
                if (!grid) return;
                grid.innerHTML = '';
                const projects = translations[currentLang].projects;
                projects.forEach((project, index) => {
                    const card = document.createElement('div');
                    card.className = `project-card glass-future rounded-3xl overflow-hidden cursor-pointer border card-glow-anim reveal`;
                    card.style.transitionDelay = (index * 0.1) + 's';
                    card.innerHTML = `
                        <div class="relative h-80 card-img-wrapper">
                            <img src="${project.images[0]}" class="w-full h-full object-cover" alt="${project.title}" loading="lazy">
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent"></div>
                            <div class="absolute bottom-6 left-6 right-6">
                                <h3 class="text-2xl font-bold neon-cyan">${project.title}</h3>
                                <p class="text-slate-400 text-sm mt-1">${translations[currentLang]['modal.clickHint']} <i class="fas fa-external-link-alt ml-1"></i></p>
                            </div>
                            <div class="absolute top-4 right-4 bg-black/60 rounded-full w-10 h-10 flex items-center justify-center text-cyan-400 text-sm border border-cyan-500/30">
                                ${project.images.length}<i class="fas fa-image ml-1 text-xs"></i>
                            </div>
                        </div>
                    `;
                    card.onclick = () => openModal(index);
                    grid.appendChild(card);
                    observer.observe(card);
                });
            }

            // ============ МОДАЛЬНОЕ ОКНО ============
            function openModal(index) {
                const project = translations[currentLang].projects[index];
                document.getElementById('modal-title').textContent = project.title;
                document.getElementById('modal-images').innerHTML = project.images.map(src => 
                    `<img src="${src}" class="modal-img rounded-2xl w-full shadow-2xl border border-cyan-500/30 object-cover h-64 md:h-72" loading="lazy">`
                ).join('');
                document.getElementById('modal-description').innerHTML = project.desc;
                const modal = document.getElementById('project-modal');
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                modal.style.opacity = '0';
                requestAnimationFrame(() => {
                    modal.style.opacity = '1';
                    modal.style.transition = 'opacity 0.4s ease';
                });
            }

            window.closeModal = function() {
                const modal = document.getElementById('project-modal');
                modal.style.opacity = '0';
                setTimeout(() => {
                    modal.classList.add('hidden');
                    document.body.style.overflow = '';
                }, 350);
            };

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    const modal = document.getElementById('project-modal');
                    if (!modal.classList.contains('hidden')) window.closeModal();
                }
            });
            document.getElementById('project-modal').addEventListener('click', function(e) {
                if (e.target === this) window.closeModal();
            });

            // ============ ПЕРЕКЛЮЧАТЕЛИ ЯЗЫКОВ ============
            document.getElementById('lang-ru').addEventListener('click', () => applyLanguage('ru'));
            document.getElementById('lang-en').addEventListener('click', () => applyLanguage('en'));
            document.getElementById('lang-ja').addEventListener('click', () => applyLanguage('ja'));

            const savedLang = localStorage.getItem('preferredLang');
            const browserLang = navigator.language?.startsWith('en') ? 'en' : (navigator.language?.startsWith('ja') ? 'ja' : 'ru');
            applyLanguage(savedLang || browserLang);

            // ============ ПАРТИКЛЫ ============
            const particlesContainer = document.getElementById('particles');
            const particleColors = ['#00ffcc', '#ff00aa', '#8b5cf6', '#00ccff', '#ff44cc', '#ffffff'];
            for (let i = 0; i < 55; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 4 + 1.5;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.background = particleColors[Math.floor(Math.random() * particleColors.length)];
                particle.style.animationDuration = Math.random() * 18 + 10 + 's';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.boxShadow = `0 0 ${size*3}px ${particle.style.background}`;
                particlesContainer.appendChild(particle);
            }

            // ============ ПАРАЛЛАКС ============
            const heroSection = document.querySelector('section');
            let parallaxActive = true;
            window.addEventListener('mousemove', (e) => {
                if (!parallaxActive || window.innerWidth < 768) return;
                const xAxis = (window.innerWidth / 2 - e.clientX) / 50;
                const yAxis = (window.innerHeight / 2 - e.clientY) / 50;
                const heroTitle = heroSection?.querySelector('h2');
                if (heroTitle) heroTitle.style.transform = `translate(${xAxis * 0.6}px, ${yAxis * 0.6}px)`;
            });
            window.addEventListener('resize', () => {
                parallaxActive = window.innerWidth >= 768;
                const heroTitle = heroSection?.querySelector('h2');
                if (heroTitle && !parallaxActive) heroTitle.style.transform = '';
            });
        })();
    </script>
</body>
</html>
